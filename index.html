</div>

</section></div><!-- ================= YOUTUBE ================= --><script src="https://www.youtube.com/iframe_api"></script><script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
"https://diadsbsxgzravpiekbhs.supabase.co";

const SUPABASE_KEY =
"sb_publishable_A67YJDLTmbx_EAsCW7-b1g_57hL5FZV";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   VARIABLES
   ========================================================= */

let currentPartyId = null;

let currentPartyPassword = "";

let players = [];

let youtubeReady = false;

let pendingPlayers = [];


/* =========================================================
   YOUTUBE : API PRETE
   ========================================================= */

function onYouTubeIframeAPIReady() {

    console.log("✅ API YouTube prête.");

    youtubeReady = true;

    processPendingPlayers();
}


/* =========================================================
   CREER LES LECTEURS EN ATTENTE
   ========================================================= */

function processPendingPlayers() {

    if (!youtubeReady) return;

    const pending =
        [...pendingPlayers];

    pendingPlayers = [];

    pending.forEach(track => {

        createYoutubePlayerNow(track);

    });

}


/* =========================================================
   NAVIGATION
   ========================================================= */

function showPage(id) {

    document
        .querySelectorAll(".page")
        .forEach(page => {

            page.classList.remove("active");

        });


    document
        .getElementById(id)
        .classList.add("active");
}


function showHome() {

    destroyPlayers();

    currentPartyId = null;

    currentPartyPassword = "";

    showPage("homePage");

    loadCreators();

    loadParties();
}


function showCreateParty() {

    document.getElementById("partyName").value = "";

    document.getElementById("partyCreator").value = "";

    document.getElementById("partyPassword").value = "";

    document.getElementById("partyEmail").value = "";

    showPage("createPage");
}


/* =========================================================
   CREER UNE PARTIE
   ========================================================= */

async function createParty() {

    const name =
        document.getElementById("partyName")
        .value.trim();

    const creator =
        document.getElementById("partyCreator")
        .value.trim();

    const password =
        document.getElementById("partyPassword")
        .value;

    const email =
        document.getElementById("partyEmail")
        .value.trim();


    if (!name || !creator) {

        alert(
            "Merci de renseigner le nom de la partie et le créateur."
        );

        return;
    }


    const { data, error } =
        await supabaseClient.rpc(
            "creer_partie",
            {
                p_nom: name,
                p_createur: creator,
                p_mot_de_passe: password,
                p_email_recuperation: email
            }
        );


    if (error) {

        console.error(error);

        alert(
            "Erreur lors de la création :\n" +
            error.message
        );

        return;
    }


    currentPartyId = data;

    currentPartyPassword = password;

    alert("✅ Partie créée !");

    showParty(
        currentPartyId,
        currentPartyPassword
    );
}


/* =========================================================
   CHARGER LES PARTIES
   ========================================================= */

async function loadParties() {

    const search =
        document.getElementById("search")
        ?.value.trim() || "";

    const creator =
        document.getElementById("creatorFilter")
        ?.value || "";


    const { data, error } =
        await supabaseClient.rpc(
            "lister_parties",
            {
                recherche: search,
                filtre_createur: creator
            }
        );


    const list =
        document.getElementById("partiesList");


    if (error) {

        console.error(error);

        list.innerHTML =
            `<div class="empty">
                Impossible de charger les parties.
            </div>`;

        return;
    }


    if (!data || data.length === 0) {

        list.innerHTML =
            `<div class="empty">
                Aucune partie trouvée.
            </div>`;

        return;
    }


    list.innerHTML = "";


    data.forEach(party => {

        const div =
            document.createElement("div");

        div.className = "party";


        const lock =
            party.protegee
            ? " 🔒"
            : "";


        div.innerHTML = `

            <div class="party-title">
                ${escapeHtml(party.nom)}
                ${lock}
            </div>

            <div class="party-info">
                Créé par
                <strong>
                    ${escapeHtml(party.createur)}
                </strong>
            </div>

        `;


        div.onclick =
            () => openParty(party);


        list.appendChild(div);

    });

}


/* =========================================================
   FILTRE CREATEURS
   ========================================================= */

async function loadCreators() {

    const select =
        document.getElementById("creatorFilter");

    if (!select) return;


    const { data, error } =
        await supabaseClient.rpc(
            "lister_parties",
            {
                recherche: "",
                filtre_createur: ""
            }
        );


    if (error || !data) return;


    const creators =
        [...new Set(
            data.map(p => p.createur)
        )];


    select.innerHTML =
        `<option value="">
            Tous les créateurs
        </option>`;


    creators
        .sort()
        .forEach(creator => {

            const option =
                document.createElement("option");

            option.value = creator;

            option.textContent = creator;

            select.appendChild(option);

        });

}


/* =========================================================
   OUVRIR UNE PARTIE
   ========================================================= */

async function openParty(party) {

    let password = "";


    if (party.protegee) {

        password =
            prompt(
                "🔒 Cette partie est protégée.\n\nMot de passe :"
            );


        if (password === null) return;


        const { data, error } =
            await supabaseClient.rpc(
                "verifier_mot_de_passe",
                {
                    p_partie_id: party.id,
                    p_mot_de_passe: password
                }
            );


        if (error) {

            console.error(error);

            alert(
                "❌ Erreur lors de la vérification du mot de passe.\n\n" +
                error.message
            );

            return;
        }


        if (!data) {

            alert("❌ Mot de passe incorrect.");

            return;
        }

    }


    currentPartyPassword = password;


    showParty(
        party.id,
        password
    );
}


/* =========================================================
   AFFICHER UNE PARTIE
   ========================================================= */

async function showParty(
    partyId,
    password = ""
) {

    destroyPlayers();

    currentPartyId = partyId;

    currentPartyPassword = password;


    const { data, error } =
        await supabaseClient.rpc(
            "charger_partie",
            {
                p_partie_id: partyId,
                p_mot_de_passe: password
            }
        );


    if (error) {

        console.error(error);

        alert(
            "Impossible de charger cette partie :\n" +
            error.message
        );

        return;
    }


    displayParty(data);

}


/* =========================================================
   AFFICHAGE PARTIE
   ========================================================= */

function displayParty(data) {

    if (!data || data.length === 0) {

        document.getElementById("partyTitle")
            .textContent = "🎵 Partie vide";

        document.getElementById("partyCreatorInfo")
            .textContent = "";

        document.getElementById("roundsList")
            .innerHTML =
            `<div class="empty">
                Cette partie ne contient encore aucune manche.
            </div>`;

        showPage("partyPage");

        return;
    }


    const first = data[0];


    document.getElementById("partyTitle")
        .textContent =
        "🎵 " + first.partie_nom;


    document.getElementById("partyCreatorInfo")
        .textContent =
        "Créé par " + first.createur;


    const rounds = {};


    data.forEach(row => {

        if (!row.manche_id) return;


        if (!rounds[row.manche_id]) {

            rounds[row.manche_id] = {

                id: row.manche_id,

                nom: row.manche_nom,

                ordre: row.manche_ordre,

                tracks: []

            };
        }


        if (row.musique_id) {

            rounds[row.manche_id]
                .tracks
                .push({

                    id: row.musique_id,

                    numero: row.musique_numero,

                    nom: row.musique_nom,

                    url: row.youtube_url

                });

        }

    });


    const list =
        document.getElementById("roundsList");

    list.innerHTML = "";


    Object
        .values(rounds)
        .sort((a,b) => a.ordre - b.ordre)
        .forEach(round => {

            renderRound(
                round,
                list
            );

        });


    showPage("partyPage");

}


/* =========================================================
   AFFICHER UNE MANCHE
   ========================================================= */

function renderRound(
    round,
    container
) {

    const div =
        document.createElement("div");

    div.className = "round";


    const count =
        round.tracks.length;


    const countText =
        count === 1
        ? "1 piste dans cette manche"
        : count + " pistes dans cette manche";


    div.innerHTML = `

        <div class="round-header">

            <div class="round-title">
                🎵 ${escapeHtml(round.nom)}
            </div>

            <div class="round-info">
                ${countText}
            </div>

        </div>

    `;


    round.tracks
        .sort((a,b) => a.numero - b.numero)
        .forEach(track => {

            div.appendChild(
                createTrack(track)
            );

        });


    container.appendChild(div);

}


/* =========================================================
   CREER UNE PISTE
   ========================================================= */

function createTrack(track) {

    const div =
        document.createElement("div");

    div.className = "track";


    div.innerHTML = `

        <div class="track-header">

            <div class="track-name">
                🎵 ${escapeHtml(track.nom)}
            </div>

            <div class="track-controls">

                <button
                    onclick="playTrack('${track.id}')"
                >
                    ▶
                </button>

                <button
                    onclick="pauseTrack('${track.id}')"
                >
                    ⏸
                </button>

                <span>🔊</span>

                <input
                    class="volume"
                    type="range"
                    min="0"
                    max="100"
                    value="100"
                    oninput="
                        changeVolume(
                            '${track.id}',
                            this.value
                        )
                    "
                >

                <button
                    class="video-toggle"
                    id="arrow-${track.id}"
                    onclick="
                        toggleVideo('${track.id}')
                    "
                    aria-label="Afficher ou masquer la vidéo"
                >
                    ▾
                </button>

            </div>

        </div>


        <div
            class="video"
            id="video-${track.id}"
        >

            <div
                class="player"
                id="player-${track.id}"
            >
                <div class="player-error">
                    Chargement de YouTube...
                </div>
            </div>

        </div>

    `;


    /*
       IMPORTANT :

       On ne crée PAS immédiatement le lecteur.

       Si l'API YouTube n'est pas encore prête,
       on met simplement la piste dans la file d'attente.
    */

    if (youtubeReady) {

        createYoutubePlayerNow(track);

    } else {

        pendingPlayers.push(track);

    }


    return div;
}


/* =========================================================
   RECUPERER ID YOUTUBE
   ========================================================= */

function getVideoId(url) {

    try {

        const u =
            new URL(url.trim());


        if (
            u.hostname === "youtube.com" ||
            u.hostname === "www.youtube.com" ||
            u.hostname.endsWith(".youtube.com")
        ) {

            /*
             * Format :
             * youtube.com/watch?v=XXXXXXXX
             */

            const id =
                u.searchParams.get("v");

            if (id) return id;


            /*
             * Format :
             * youtube.com/shorts/XXXXXXXX
             */

            if (
                u.pathname.startsWith("/shorts/")
            ) {

                return u.pathname
                    .split("/")[2]
                    ?.split("?")[0] || null;

            }


            /*
             * Format :
             * youtube.com/embed/XXXXXXXX
             */

            if (
                u.pathname.startsWith("/embed/")
            ) {

                return u.pathname
                    .split("/")[2]
                    ?.split("?")[0] || null;

            }

        }


        /*
         * Format :
         * youtu.be/XXXXXXXX
         */

        if (
            u.hostname === "youtu.be"
        ) {

            return u.pathname
                .substring(1)
                .split("?")[0]
                .split("/")[0] || null;

        }

    } catch(e) {

        console.error(
            "URL YouTube incorrect :",
            url,
            e
        );

    }


    return null;
}


/* =========================================================
   CREER LE LECTEUR YOUTUBE
   ========================================================= */

function createYoutubePlayerNow(track) {

    if (!youtubeReady) {

        pendingPlayers.push(track);

        return;

    }


    const container =
        document.getElementById(
            "player-" + track.id
        );


    /*
       La manche peut avoir été détruite entre-temps.
    */

    if (!container) return;


    /*
       Évite de créer deux fois le même lecteur.
    */

    if (
        players.some(
            item => item.id === String(track.id)
        )
    ) {

        return;

    }


    const videoId =
        getVideoId(track.url);


    if (!videoId) {

        container.innerHTML =
            `<div class="player-error">
                ⚠️ Lien YouTube invalide
            </div>`;

        return;

    }


    /*
       Le conteneur doit être vide avant
       que YT.Player le remplace par son iframe.
    */

    container.innerHTML = "";


    try {

        const player =
            new YT.Player(
                container,
                {

                    width: "100%",

                    height: "100%",

                    videoId: videoId,

                    playerVars: {

                        autoplay: 0,

                        controls: 1,

                        rel: 0,

                        playsinline: 1

                    },

                    events: {

                        onReady: function(event) {

                            console.log(
                                "✅ YouTube prêt :",
                                track.nom
                            );

                            event.target.setVolume(100);


                            /*
                               On mémorise que ce lecteur
                               est réellement prêt.
                            */

                            const item =
                                players.find(
                                    p =>
                                        p.id ===
                                        String(track.id)
                                );

                            if (item) {

                                item.ready = true;

                            }

                        },

                        onError: function(event) {

                            console.error(
                                "Erreur YouTube pour",
                                track.nom,
                                event.data
                            );

                            const errorMessages = {

                                2:
                                    "Identifiant vidéo incorrect.",

                                5:
                                    "Erreur du lecteur HTML5.",

                                100:
                                    "Cette vidéo n'existe plus ou est privée.",

                                101:
                                    "Cette vidéo n'autorise pas la lecture intégrée.",

                                150:
                                    "Cette vidéo n'autorise pas la lecture intégrée."

                            };


                            container.innerHTML =
                                `<div class="player-error">
                                    ⚠️ ${
                                        errorMessages[event.data]
                                        ||
                                        "Impossible de charger cette vidéo."
                                    }
                                </div>`;

                        },

                        onAutoplayBlocked: function() {

                            console.warn(
                                "Autoplay bloqué pour :",
                                track.nom
                            );

                        }

                    }

                }
            );


        players.push({

            id: String(track.id),

            player: player,

            ready: false,

            name: track.nom

        });

    } catch(error) {

        console.error(
            "Impossible de créer le lecteur YouTube :",
            error
        );


        container.innerHTML =
            `<div class="player-error">
                ⚠️ Impossible de charger le lecteur YouTube.
            </div>`;

    }

}


/* =========================================================
   VIDEO OUVRIR / FERMER
   ========================================================= */

function toggleVideo(id) {

    const video =
        document.getElementById(
            "video-" + id
        );

    const arrow =
        document.getElementById(
            "arrow-" + id
        );


    if (!video || !arrow) return;


    if (
        video.classList.contains("visible")
    ) {

        video.classList.remove("visible");

        arrow.textContent = "▾";

    } else {

        video.classList.add("visible");

        arrow.textContent = "▴";

    }

}


/* =========================================================
   TROUVER UN LECTEUR
   ========================================================= */

function findPlayer(id) {

    const item =
        players.find(
            p =>
                p.id === String(id)
        );


    return item
        ? item.player
        : null;
}


/* =========================================================
   ATTENDRE QUE LES LECTEURS SOIENT PRETS
   ========================================================= */

function waitForPlayersReady(
    timeout = 10000
) {

    return new Promise(resolve => {

        const start =
            Date.now();


        function check() {

            const activePlayers =
                players.filter(
                    item =>
                        item &&
                        item.player
                );


            if (
                activePlayers.length === 0
            ) {

                resolve([]);

                return;

            }


            const readyPlayers =
                activePlayers.filter(
                    item => item.ready
                );


            if (
                readyPlayers.length ===
                activePlayers.length
            ) {

                resolve(readyPlayers);

                return;

            }


            if (
                Date.now() - start >=
                timeout
            ) {

                console.warn(
                    "Délai dépassé : certains lecteurs YouTube ne sont pas prêts."
                );

                resolve(readyPlayers);

                return;

            }


            setTimeout(
                check,
                100
            );

        }


        check();

    });

}


/* =========================================================
   LECTURE D'UNE PISTE
   ========================================================= */

function playTrack(id) {

    const player =
        findPlayer(id);

    if (!player) {

        alert(
            "Le lecteur YouTube n'est pas encore prêt."
        );

        return;

    }


    try {

        player.playVideo();

    } catch(error) {

        console.error(error);

    }

}


/* =========================================================
   PAUSE D'UNE PISTE
   ========================================================= */

function pauseTrack(id) {

    const player =
        findPlayer(id);

    if (player) {

        try {

            player.pauseVideo();

        } catch(error) {

            console.error(error);

        }

    }

}


/* =========================================================
   VOLUME
   ========================================================= */

function changeVolume(
    id,
    volume
) {

    const player =
        findPlayer(id);

    if (player) {

        try {

            player.setVolume(
                Number(volume)
            );

        } catch(error) {

            console.error(error);

        }

    }

}


/* =========================================================
   TOUT LIRE
   ========================================================= */

async function playAll() {

    if (players.length === 0) {

        alert(
            "Aucune piste YouTube n'est disponible."
        );

        return;

    }


    /*
       On attend que les lecteurs aient réellement
       terminé leur chargement.
    */

    const readyPlayers =
        await waitForPlayersReady(10000);


    if (readyPlayers.length === 0) {

        alert(
            "Les lecteurs YouTube ne sont pas encore prêts.\n\n" +
            "Vérifie que les vidéos apparaissent lorsque tu ouvres les flèches."
        );

        return;

    }


    let launched = 0;


    readyPlayers.forEach(item => {

        try {

            item.player.playVideo();

            launched++;

        } catch(error) {

            console.error(
                "Impossible de lancer :",
                item.name,
                error
            );

        }

    });


    console.log(
        launched +
        " piste(s) lancée(s)."
    );

}


/* =========================================================
   TOUT ARRETER
   ========================================================= */

function pauseAll() {

    players.forEach(item => {

        if (
            item &&
            item.player &&
            item.ready
        ) {

            try {

                item.player.pauseVideo();

            } catch(error) {

                console.error(error);

            }

        }

    });

}


/* =========================================================
   DETRUIRE LES LECTEURS
   ========================================================= */

function destroyPlayers() {

    players.forEach(item => {

        try {

            if (
                item &&
                item.player &&
                typeof item.player.destroy ===
                "function"
            ) {

                item.player.destroy();

            }

        } catch(e) {}

    });


    players = [];

    pendingPlayers = [];

}

/* =========================================================
   SAUVEGARDE MANCHE
   ========================================================= */

async function saveRound() {

    const name =
        document.getElementById("roundName")
        .value.trim();


    if (!name) {

        alert(
            "Merci de donner un nom à la manche."
        );

        return;
    }


    /*
       On utilise un ordre basé sur le nombre
       de millisecondes, mais en le transformant
       en nombre compatible avec PostgreSQL integer.

       IMPORTANT :
       Date.now() dépasse la limite d'un integer
       PostgreSQL.
    */

    const ordre =
        Math.floor(
            Date.now() / 1000
        );


    const result =
        await supabaseClient.rpc(
            "creer_manche",
            {
                p_partie_id: currentPartyId,
                p_nom: name,
                p_ordre: ordre,
                p_mot_de_passe: ""
            }
        );


    if (result.error) {

        console.error(result.error);

        alert(
            "Erreur :\n" +
            result.error.message
        );

        return;
    }


    const mancheId =
        result.data;


    const names =
        document.querySelectorAll(
            ".trackName"
        );


    const urls =
        document.querySelectorAll(
            ".trackUrl"
        );


    let count = 0;


    for (
        let i = 0;
        i < 7;
        i++
    ) {

        const nom =
            names[i].value.trim();

        const url =
            urls[i].value.trim();


        if (!nom || !url) continue;


        const result =
            await supabaseClient.rpc(
                "enregistrer_musique",
                {

                    p_manche_id: mancheId,

                    p_numero: i + 1,

                    p_nom: nom,

                    p_youtube_url: url,

                    p_mot_de_passe: ""

                }
            );


        if (result.error) {

            console.error(result.error);

            alert(
                "Erreur sur la piste " +
                (i + 1) +
                " :\n" +
                result.error.message
            );

            return;
        }


        count++;

    }


    alert(
        "✅ Manche enregistrée !\n\n" +
        count +
        (
            count > 1
            ? " pistes ont été enregistrées."
            : " piste a été enregistrée."
        )
    );


    showParty(
        currentPartyId,
        currentPartyPassword
    );

}

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}
